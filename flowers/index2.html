<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
</head>

<body>
    <div class="product-card">

        <div class="product-image">
            <img src="urun5.jpg" alt="Romantik pembe gül buketi">

            <button class="favorite-btn" aria-label="Favorilere ekle">
                ♡
            </button>


        </div>

        <div class="product-info">


            <h3>Elegant Pink Bouquet</h3>



            <div class="product-bottom">
                <span class="product-price">350 AED</span>


            </div>

            <button class="add-to-cart">
                <i class="fa-solid fa-cart-shopping cart-icon"></i>
            </button>
        </div>

    </div>

    <div class="flower-product">

        <div class="flower-photo">
            <img src="urun4.jpg" alt="Romantik pembe gül buketi">

            <button class="flower-favorite" aria-label="Favorilere ekle">
                ♡
            </button>
        </div>

        <div class="flower-details">

            <h3 class="flower-name">Elegant Bouquet</h3>

            <div class="flower-purchase">
                <span class="flower-price">350 AED</span>
            </div>

            <button class="flower-cart">
                <i class="fa-solid fa-cart-shopping flower-cart-icon"></i>
            </button>

        </div>

    </div>

</body>

</html>
